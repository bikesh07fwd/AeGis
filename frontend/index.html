<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI Operating System</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <header class="glass-panel">
            <h1>Enterprise AI OS</h1>
            <div class="metrics">
                <div class="metric">
                    <span class="label">Tokens</span>
                    <span class="value" id="token-count">0</span>
                </div>
                <div class="metric">
                    <span class="label">Cost</span>
                    <span class="value" id="cost-value">$0.00</span>
                </div>
                <div class="metric">
                    <span class="label">Status</span>
                    <span class="value status-indicator" id="system-status">Idle</span>
                </div>
            </div>
        </header>

        <main>
            <section class="chat-section glass-panel">
                <div class="chat-history" id="chat-history">
                    <!-- Messages will appear here -->
                </div>
                <div class="input-area">
                    <input type="text" id="query-input" placeholder="Ask the Enterprise AI..." autocomplete="off">
                    <button id="send-btn">Execute</button>
                </div>
            </section>

            <aside class="sidebar">
                <section class="timeline-section glass-panel">
                    <h2>Live Execution Timeline</h2>
                    <ul class="timeline" id="timeline">
                        <!-- Timeline events -->
                    </ul>
                </section>
                
                <section class="memory-section glass-panel">
                    <h2>Memory Viewer</h2>
                    <div id="memory-content" class="code-block">
// Ready to receive semantic facts...
                    </div>
                </section>
            </aside>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
